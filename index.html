<!doctype html>
<html lang=en-us>
    <head>
        <meta charset=utf-8>
        <meta content="text/html; charset=utf-8" http-equiv=Content-Type>
        <title>Sokonway</title>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            body {
                font-family: monospace;
                display: flex;
                flex-direction: column;
            }

            input[type='button'] { font-family: inherit }

            .canvas_container {
                border: 1px solid #000;
                flex: 1;
                min-width: 0;
                min-height: 0;
            }

            canvas {
                border: 0 none;
                background-color: #000;
                width: 100%;
                height: 100%;
                image-rendering: pixelated;
            }

            #controls {
                display: flex;
                justify-content: space-around;
                flex-shrink: 0;
                margin: 5px;
                padding: 5px;
                gap: 10px;
            }
        </style>
    </head>
    <body>
        <div id=controls>
            <div>
                <input type=checkbox id=resize>
                <label for="resize">Resize canvas</label>
            </div>
            <div>
                <input type=button
                    onclick='Module.requestFullscreen(document.getElementById("pointerLock").checked,document.getElementById("resize").checked)'
                    value=Fullscreen>
            </div>
            <div>
                <input type=checkbox id=pointerLock checked>
                <label for="pointerLock">Lock/Hide mouse pointer</label>
            </div>
        </div>
        <div class=canvas_container>
            <canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
        </div>
        <script>
            var canvasElement = document.getElementById("canvas");
            canvasElement.addEventListener("webglcontextlost", e => {
                alert("WebGL context lost. You will need to reload the page.");
                e.preventDefault();
            }, false);
            var setStatus = e => {
                if (setStatus.last || (setStatus.last = { time: Date.now(), text: "" }), e !== setStatus.last.text) {
                    var t = e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    var n = Date.now();
                    t && n - setStatus.last.time < 30 || (setStatus.last.time = n, setStatus.last.text = e, console.log(e));
                }
            };
            var Module = {
                print(...e) {
                    console.log(...e);
                },
                canvas: canvasElement,
                setStatus: setStatus,
                totalDependencies: 0,
                monitorRunDependencies(e) {
                    this.totalDependencies = Math.max(this.totalDependencies, e);
                    setStatus(e ? "Preparing... (" + (this.totalDependencies - e) + "/" + this.totalDependencies + ")" : "All downloads complete.");
                }
            };
            setStatus("Downloading...");
            window.onerror = window.onunhandledrejection = () => {
                setStatus("Exception thrown, see JavaScript console");
                setStatus = e => {
                    e && console.error("[post-exception status] " + e);
                };
            };
            window.addEventListener("keydown", (event) => {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
                    event.preventDefault();
                }
            });
        </script>
        <script async src=sokonway.js></script>
    </body>
</html>
